<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Conference Photo Dashboard</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="dashboard">
    <main class="main-panel">
      <section class="panel floorplan-panel">
        <div class="panel-header">
          <h2>Floor plan heatmap</h2>
          <div class="heatmap-legend">
            <span>cold</span>
            <span class="bar"></span>
            <span>hot</span>
          </div>
          <span id="photo-count" class="badge">0 photos</span>
        </div>
        <div class="floorplan-stage" id="floorplan-stage">
          <img id="floorplan-image" alt="Venue floor plan" />
          <canvas id="heatmap-canvas"></canvas>
        </div>
      </section>

      <section class="panel gallery-panel">
        <div class="panel-header">
          <h2>Recent photos</h2>
        </div>
        <div class="gallery-slider">
          <button type="button" class="gallery-nav gallery-prev" aria-label="Scroll left">&#8249;</button>
          <div class="gallery-track" id="gallery-track">
            <p class="gallery-empty" id="gallery-empty">No photos yet — be the first to upload!</p>
          </div>
          <button type="button" class="gallery-nav gallery-next" aria-label="Scroll right">&#8250;</button>
        </div>
      </section>
    </main>

    <aside class="sidebar" id="sidebar">
      <button type="button" class="sidebar-toggle" id="sidebar-toggle" aria-label="Collapse sidebar" aria-expanded="true">
        <span class="chevron">&#8250;</span>
      </button>

      <div class="sidebar-content">
        <h1>Share your photos</h1>
        <p class="subtitle">Upload a photo from the conference and tag where it was taken.</p>

        <form id="upload-form">
          <!-- Honeypot: real visitors never see or fill this in (hidden
               off-screen); simple bots that auto-fill every field do. -->
          <div class="honeypot-field" aria-hidden="true">
            <label for="website">Website</label>
            <input type="text" id="website" name="website" tabindex="-1" autocomplete="off" />
          </div>

          <label for="access-code">Conference code</label>
          <input type="text" id="access-code" name="access-code" autocomplete="off" required placeholder="From event signage" />

          <label for="photo">Photo</label>
          <input type="file" id="photo" name="photo" accept="image/*" capture="environment" required />
          <img id="preview" alt="Selected photo preview" hidden />

          <label for="room">Room</label>
          <select id="room" name="room" required></select>

          <label for="description">Description</label>
          <textarea id="description" name="description" rows="3" placeholder="What's happening in this photo?"></textarea>

          <label for="contributor">Your name</label>
          <input type="text" id="contributor" name="contributor" placeholder="Optional" />

          <button type="submit" id="submit-btn">Upload</button>
        </form>

        <p id="status" role="status" aria-live="polite"></p>
      </div>
    </aside>
  </div>

  <div class="lightbox" id="lightbox" hidden>
    <button type="button" class="lightbox-close" id="lightbox-close" aria-label="Close">&times;</button>
    <img id="lightbox-image" alt="" />
    <p id="lightbox-caption"></p>
  </div>

  <script type="module" src="app.js"></script>
</body>
</html>
