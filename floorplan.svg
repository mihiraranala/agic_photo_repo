<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 600" width="1000" height="600">
  <rect x="0" y="0" width="1000" height="600" fill="#f7f7f5"/>
  <rect x="20" y="20" width="960" height="560" fill="none" stroke="#9aa0a6" stroke-width="4"/>

  <!-- Room A: centered ~ (200,180) -->
  <rect x="60" y="60" width="280" height="240" fill="#ffffff" stroke="#9aa0a6" stroke-width="3"/>
  <text x="200" y="185" text-anchor="middle" font-family="sans-serif" font-size="28" fill="#5f6368">Room A</text>

  <!-- Room C: centered ~ (800,180) -->
  <rect x="660" y="60" width="280" height="240" fill="#ffffff" stroke="#9aa0a6" stroke-width="3"/>
  <text x="800" y="185" text-anchor="middle" font-family="sans-serif" font-size="28" fill="#5f6368">Room C</text>

  <!-- Room B: centered ~ (500,420) -->
  <rect x="360" y="320" width="280" height="220" fill="#ffffff" stroke="#9aa0a6" stroke-width="3"/>
  <text x="500" y="435" text-anchor="middle" font-family="sans-serif" font-size="28" fill="#5f6368">Room B</text>

  <!-- Hallways -->
  <rect x="340" y="150" width="320" height="60" fill="#ffffff" stroke="#9aa0a6" stroke-width="2"/>
  <rect x="470" y="210" width="60" height="110" fill="#ffffff" stroke="#9aa0a6" stroke-width="2"/>

  <text x="500" y="30" text-anchor="middle" font-family="sans-serif" font-size="16" fill="#9aa0a6">Placeholder floor plan — replace floorplan.svg with the real one</text>
</svg>
